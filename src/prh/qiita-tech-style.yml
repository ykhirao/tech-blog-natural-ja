# prh (proofreading helper) 辞書 — 日本語技術記事の表記
#
# textlint-rule-prh から読み込んで使う。
#
#     npm install --no-save textlint textlint-rule-prh
#     # .textlintrc.json
#     { "rules": { "prh": { "rulePaths": ["./src/prh/qiita-tech-style.yml"] } } }
#
# 収録した語は、Qiita 約1万本(2020年8月 vs 2026年8月、AI話題の記事を除く)の
# 実測で出現率が大きく動いたもの。思いつきの禁止語リストではない。
#
# 重要: ここに並ぶのは「文書内参照」と「ぼかし表現」で、どちらも
# 技術文書として書き換える理由が説明できるものだけ。
# 単に「AI以後に減った」という理由だけでは入れていない。
#
# MIT License

version: 1

rules:
  # ------------------------------------------------------------------
  # 文書内参照。実測で最も大きく減った文体語。
  # 「下記」は 17.4% → 4.7% (0.27倍)、「上記」は 21.1% → 9.6% (0.45倍)。
  #
  # 書き換える理由: 紙の文書由来の表現で、Webでは位置関係が崩れる。
  # 画面幅や折り返しで「下」が下にあるとは限らない。
  # ------------------------------------------------------------------
  - expected: 次の
    patterns:
      - 下記の
    prh: 「下記」は紙の文書の言い方。Webでは位置が変わるので「次の」が確実

  - expected: 次のとおり
    patterns:
      - 下記のとおり
      - 下記の通り

  - expected: 前述の
    patterns:
      - 上記の
    prh: 「上記」は紙の文書の言い方。Webでは位置が変わる。表や図を指すなら「次の表」のように具体名で

  - expected: 前述のとおり
    patterns:
      - 上記のとおり
      - 上記の通り

  # ------------------------------------------------------------------
  # ぼかし表現。実測で軒並み減っている。
  #   適当     6.2% → 1.6% (0.26x)
  #   色々    11.5% → 3.1% (0.27x)
  #   とりあえず 9.4% → 3.1% (0.33x)
  #   〜な感じ  19.0% → 6.6% (0.35x)
  #
  # 書き換える理由: 技術文書では「何が」「どれだけ」が要る。
  # ぼかすと読み手が判断できない。
  # ------------------------------------------------------------------
  - expected: $1
    patterns:
      - /(.{2,8})な感じです/
    prh: 「〜な感じです」はぼかし。断定できるなら断定する

  - expected: 適切な
    patterns:
      - 適当な
    prh: 「適当」は「ふさわしい」と「いいかげん」の両義。技術文書では避ける

  - expected: いくつかの
    patterns:
      - 色々な
      - いろいろな
    prh: 「色々」ではなく、数や種類を具体的に書く

  - expected: まず
    patterns:
      - とりあえず
      - 取り敢えず
    prh: 「とりあえず」は判断を保留する語。手順なら「まず」

  # ------------------------------------------------------------------
  # 表記の統一。技術文書の慣習に合わせる。
  # ------------------------------------------------------------------
  - expected: まとめ
    patterns:
      - 纏め
    prh: 常用漢字表にない。ひらく

  - expected: ちなみに
    patterns:
      - 因みに
    prh: 常用漢字表にない。ひらく

  - expected: ちょっと
    patterns:
      - 一寸
    prh: 「一寸」は読み違える。ひらく

  - expected: とても
    patterns:
      - 迚も
    prh: 常用漢字表にない。ひらく

  - expected: あまり
    patterns:
      - 余り
    prh: 副詞の「あまり」はひらく

  - expected: おいしい
    patterns:
      - 旨い
    prh: 常用漢字表にない読み。ひらく

  # ------------------------------------------------------------------
  # 冗長表現。文字数を食うだけで情報が増えない。
  # ------------------------------------------------------------------
  - expected: できます
    patterns:
      - することが可能です
      - することができます
    prh: 冗長。「できます」で足りる

  - expected: $1できます
    patterns:
      - /(.{2,10})することが可能です/

  - expected: する場合
    patterns:
      - する場合において
    prh: 「場合において」は法令調で硬い

  # ------------------------------------------------------------------
  # 読点の後の接続。実測で読点が1文あたり 0.58 → 0.90 個に増えている。
  # 以下は文を分けたほうがよい典型。
  # ------------------------------------------------------------------
  - expected: 。そのため
    patterns:
      - 、そのため
    prh: 因果が変わる箇所は文を分けると読みやすい
    specs: []
