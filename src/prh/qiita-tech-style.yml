# prh (proofreading helper) 辞書 — 日本語技術記事の表記
#
# textlint-rule-prh から読み込んで使う。
#
#     npm install --no-save textlint textlint-rule-prh
#     # .textlintrc.json
#     { "rules": { "prh": { "rulePaths": ["./src/prh/qiita-tech-style.yml"] } } }
#
# 収録した語は、Qiita 約1万本(2020年8月 vs 2026年8月、AI話題の記事を除く)の
# 実測で出現率が大きく動いたもの。思いつきの禁止語リストではない。
#
# 重要: ここに並ぶのは「文書内参照」と「ぼかし表現」で、どちらも
# 技術文書として書き換える理由が説明できるものだけ。
# 単に「AI以後に減った」という理由だけでは入れていない。
#
# MIT License

version: 1

rules:
  # ------------------------------------------------------------------
  # 文書内参照。実測で最も大きく減った文体語。
  # 「下記」は 17.4% → 4.7% (0.27倍)、「上記」は 21.1% → 9.6% (0.45倍)。
  #
  # 書き換える理由: 紙の文書由来の表現で、Webでは位置関係が崩れる。
  # 画面幅や折り返しで「下」が下にあるとは限らない。
  # ------------------------------------------------------------------
  - expected: 次の
    patterns:
      - 下記の
    prh: 「下記」は紙の文書の言い方。Webでは位置が変わるので「次の」が確実

  - expected: 次のとおり
    patterns:
      - 下記のとおり
      - 下記の通り

  - expected: 前述の
    patterns:
      - 上記の
    prh: 「上記」は紙の文書の言い方。Webでは位置が変わる。表や図を指すなら「次の表」のように具体名で

  - expected: 前述のとおり
    patterns:
      - 上記のとおり
      - 上記の通り

  # ------------------------------------------------------------------
  # ぼかし表現。実測で軒並み減っている。
  #   適当     6.2% → 1.6% (0.26x)
  #   色々    11.5% → 3.1% (0.27x)
  #   とりあえず 9.4% → 3.1% (0.33x)
  #   〜な感じ  19.0% → 6.6% (0.35x)
  #
  # 書き換える理由: 技術文書では「何が」「どれだけ」が要る。
  # ぼかすと読み手が判断できない。
  # ------------------------------------------------------------------
  - expected: $1
    patterns:
      - /(.{2,8})な感じです/
    prh: 「〜な感じです」はぼかし。断定できるなら断定する

  - expected: 適切な
    patterns:
      - 適当な
    prh: 「適当」は「ふさわしい」と「いいかげん」の両義。技術文書では避ける

  - expected: いくつかの
    patterns:
      - 色々な
      - いろいろな
    prh: 「色々」ではなく、数や種類を具体的に書く

  - expected: まず
    patterns:
      - とりあえず
      - 取り敢えず
    prh: 「とりあえず」は判断を保留する語。手順なら「まず」

  # ------------------------------------------------------------------
  # 表記の統一。技術文書の慣習に合わせる。
  # ------------------------------------------------------------------
  - expected: まとめ
    patterns:
      - 纏め
    prh: 常用漢字表にない。ひらく

  - expected: ちなみに
    patterns:
      - 因みに
    prh: 常用漢字表にない。ひらく

  - expected: ちょっと
    patterns:
      - 一寸
    prh: 「一寸」は読み違える。ひらく

  - expected: とても
    patterns:
      - 迚も
    prh: 常用漢字表にない。ひらく

  - expected: あまり
    patterns:
      - 余り
    prh: 副詞の「あまり」はひらく

  - expected: おいしい
    patterns:
      - 旨い
    prh: 常用漢字表にない読み。ひらく

  # ------------------------------------------------------------------
  # 冗長表現。文字数を食うだけで情報が増えない。
  # ------------------------------------------------------------------
  - expected: できます
    patterns:
      - することが可能です
      - することができます
    prh: 冗長。「できます」で足りる

  - expected: $1できます
    patterns:
      - /(.{2,10})することが可能です/

  - expected: する場合
    patterns:
      - する場合において
    prh: 「場合において」は法令調で硬い

  # ------------------------------------------------------------------
  # 読点の後の接続。実測で読点が1文あたり 0.58 → 0.90 個に増えている。
  # 以下は文を分けたほうがよい典型。
  # ------------------------------------------------------------------
  - expected: 。そのため
    patterns:
      - 、そのため
    prh: 因果が変わる箇所は文を分けると読みやすい
    specs: []

  # ------------------------------------------------------------------
  # 翻訳調の骨組み。英語の構文をそのまま日本語に移したもの。
  #
  # 実測(2020年8月 vs 2026年8月、千字あたりの出現数):
  #   重要なのは〜      0.002 → 0.020 (12.6倍)  What matters is
  #   ここで重要        0.001 → 0.005 ( 7.5倍)  Here, it is important
  #   一方で〜          0.009 → 0.064 ( 7.0倍)  On the other hand
  #   つまり〜          0.013 → 0.053 ( 4.0倍)  In other words
  #   ポイントは〜      0.007 → 0.022 ( 3.3倍)  The key is
  #   結果は〜です      0.003 → 0.005 ( 1.8倍)  The result is
  #
  # 注意: 「一方で」「つまり」自体は正当な接続詞なので禁止しない。
  # 実例を見ると逆接・言い換えとして正しく使われている。
  # ここで直すのは「骨組みだけ英語で、中身が薄い」型に限る。
  # ------------------------------------------------------------------

  # 「重要なのはXという点です」の「という点です」は空回りしている。
  # 英語 "What matters is that X" をなぞった形。
  #
  # 注意: X は動詞句のことが多く(「〜を分離する」)、機械的に「Xが重要」と
  # 置換すると「分離するが重要」という非文になる。実際に一度そうなった。
  # そこで名詞で終わる X に限って置換し、それ以外は触らない。
  - expected: 重要なのは$1です
    patterns:
      - /重要なのは[、]?「?(.{4,40}?[^るいうくすつぬむぶ])」?という点です/
    prh: 「〜という点です」は英語の that 節の直訳。「という点」は外せる

  - expected: 重要なのは$1です
    patterns:
      - /重要なのは[、]?「?(.{4,40}?[^るいうくすつぬむぶ])」?ということです/

  # 「ポイントはN つ」自体は自然だが、「〜という点」が続くと冗長
  - expected: ポイントは$1です
    patterns:
      - /(?:ポイント|要点)は[、]?「?(.{4,40}?[^るいうくすつぬむぶ])」?という点です/
    prh: 「という点です」を外しても意味は変わらない

  # 動詞句で終わる場合は「〜することです」に寄せる。
  # 「Xするという点です」→「Xすることです」。これなら文法的に成立する。
  - expected: 重要なのは$1ことです
    patterns:
      - /重要なのは[、]?「?(.{4,40}?[るいうくすつぬむぶ])」?という点です/
    prh: 「という点です」は英語 that 節の直訳。「ことです」で足りる

  - expected: ポイントは$1ことです
    patterns:
      - /(?:ポイント|要点)は[、]?「?(.{4,40}?[るいうくすつぬむぶ])」?という点です/
    prh: 「という点です」は外せる

  # 「という点です」について
  #
  # 実測では 0.57% → 4.68% (8倍) と、翻訳調の語尾として最も増えている。
  # 英語 "the point that X" の直訳で、多くは「ことです」で足りる。
  #
  # ただし prh ルールとしては入れない。実際に書いて実記事にかけたところ、
  # 「誤解してほしくないのは、〜ではないという点です」のような文で、
  # 正規表現が前半だけを拾って後半を丸ごと落とす置換になった。
  # prh は --fix で自動置換されるので、意味を壊すルールを置くわけにはいかない。
  #
  # この語尾は textlint ルール側か、プロンプトでの指摘に回す。

